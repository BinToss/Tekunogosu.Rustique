name: Rustique Workflow

on:
  push:
    #    branches: [ omega ] - disable this for production. Only build when there is a release
    # should be turned on for specific testing branches
    tags: ["v*"]
  pull_request:
    branches: [omega]
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: rustique
            release_name: rustique
            asset_name: rustique-linux-x86_64
            rustflags: ""

          #          - os: ubuntu-latest
          #            target: aarch64-unknown-linux-musl
          #            binary_name: rustique-cli
          #            release_name: rustique
          #            asset_name: rustique-linux-arm64
          #            rustflags: "-C linker=aarch64-linux-gnu-gcc"

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rustique.exe
            release_name: rustique.exe
            asset_name: rustique-windows-x86_64
            rustflags: "-C link-args=/SUBSYSTEM:CONSOLE"

    #          - os: macos-latest
    #            target: x86_64-apple-darwin
    #            binary_name: rustique
    #            release_name: rustique
    #            asset_name: rustique-macos-x86_64
    #            rustflags: ""
    #
    #          - os: macos-latest
    #            target: aarch64-apple-darwin
    #            binary_name: rustique
    #            release_name: rustique
    #            asset_name: rustique-macos-arm64
    #            rustflags: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      #    - name: Install cross-compilation tools (ARM64)
      #      if: matrix.target == 'aarch64-unknown-linux-musl'
      #      run: |
      #        sudo apt-get update
      #        sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
      #        rustup target add aarch64-unknown-linux-musl

      - name: Build CLI with Cargo
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }} --package rustique-cli

      # Cargo names the binary after the workspace member, so we get rustique-cli.
      # Rename it here instead of at release time so the build artifacts are correct too,
      # otherwise anything pulled from the Actions run page still has the old name
      - name: Rename binary to rustique
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv "${{ matrix.binary_name }}" "${{ matrix.release_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.release_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      # The binaries were already renamed in the build job, so this just zips each
      # artifact dir up under its platform name. The self updater looks for a file called
      # rustique (or rustique.exe) at the root of the zip, so don't nest anything in here
      - name: Create platform-specific archives
        run: |
          mkdir -p archives
          cd release-artifacts
          for dir in */; do
            platform=$(basename "$dir")
            (cd "$dir" && zip -9 "../../archives/${platform}.zip" *)
          done
          echo "Archive contents:"
          for z in ../archives/*.zip; do
            echo "== $z"
            unzip -l "$z"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: archives/*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
